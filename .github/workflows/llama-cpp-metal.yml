name: Build llama.cpp (macOS Metal)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "llama.cpp tag to build (e.g. b9860)"
        required: true

permissions:
  contents: write
  pull-requests: write

# Metal build releases are published to a dedicated repo, not this one, so
# they don't interleave with modelship's own vX.Y.Z release tags. The
# default GITHUB_TOKEN can't write there — LLAMA_CPP_BUILDS_TOKEN must be a
# PAT (classic or fine-grained) with contents:write on LLAMA_CPP_BUILDS_REPO,
# stored as a repo secret here.
env:
  LLAMA_CPP_BUILDS_REPO: modelship-ai/llama-cpp-builds

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout modelship
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.tag }}
          path: llama.cpp

      - name: Build
        working-directory: llama.cpp
        run: |
          cmake -B build -DGGML_METAL_USE_BF16=ON -DGGML_METAL_EMBED_LIBRARY=ON \
                         -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build --config Release -j "$(sysctl -n hw.ncpu)" --target llama-server

      - name: Package
        id: package
        working-directory: llama.cpp
        run: |
          TAG=${{ inputs.tag }}
          NAME="llama-server-${TAG}-macos-arm64-metal"
          mkdir "$NAME"
          cp build/bin/llama-server "$NAME"/
          cp build/bin/*.dylib "$NAME"/ 2>/dev/null || true
          cp LICENSE "$NAME"/
          tar czf "${NAME}.tar.gz" "$NAME"
          SHA=$(shasum -a 256 "${NAME}.tar.gz" | awk '{print $1}')
          echo "$SHA" > "${NAME}.tar.gz.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish release
        working-directory: llama.cpp
        env:
          GH_TOKEN: ${{ secrets.LLAMA_CPP_BUILDS_TOKEN }}
        run: |
          TAG=${{ inputs.tag }}
          NAME="llama-server-${TAG}-macos-arm64-metal"
          gh release create "llamacpp-${TAG}-metal" \
            --repo "${{ env.LLAMA_CPP_BUILDS_REPO }}" \
            --title "llama.cpp ${TAG} (macOS Metal)" \
            --notes "Own-CI build of ggml-org/llama.cpp ${TAG} with CMAKE_OSX_DEPLOYMENT_TARGET=14.0, built from modelship's llama-cpp-metal.yml workflow. sha256: ${{ steps.package.outputs.sha256 }}" \
            --prerelease \
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"

      - name: Install crane
        run: brew install crane

      - name: Resolve upstream Docker image digests
        id: digests
        run: |
          TAG=${{ inputs.tag }}
          CUDA_REF="ghcr.io/ggml-org/llama.cpp:server-cuda13-${TAG}"
          CPU_REF="ghcr.io/ggml-org/llama.cpp:server-${TAG}"
          CUDA_DIGEST=$(crane digest "$CUDA_REF")
          CPU_DIGEST=$(crane digest "$CPU_REF")
          echo "cuda_ref=${CUDA_REF}@${CUDA_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "cpu_ref=${CPU_REF}@${CPU_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Open pin-bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ inputs.tag }}
          SHA=${{ steps.package.outputs.sha256 }}
          CUDA_IMAGE="${{ steps.digests.outputs.cuda_ref }}"
          CPU_IMAGE="${{ steps.digests.outputs.cpu_ref }}"
          BRANCH="llama-cpp/${TAG}"
          LAUNCHER="modelship/launcher.py"
          DOCKERFILE="Dockerfile"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i '' "s/^_LLAMA_CPP_TAG = .*/_LLAMA_CPP_TAG = \"${TAG}\"/" "$LAUNCHER"
          sed -i '' "s/^_LLAMA_CPP_METAL_SHA256 = .*/_LLAMA_CPP_METAL_SHA256 = \"${SHA}\"/" "$LAUNCHER"
          sed -i '' "s|^ARG LLAMA_CPP_IMAGE_CUDA=.*|ARG LLAMA_CPP_IMAGE_CUDA=${CUDA_IMAGE}|" "$DOCKERFILE"
          sed -i '' "s|^ARG LLAMA_CPP_IMAGE_CPU=.*|ARG LLAMA_CPP_IMAGE_CPU=${CPU_IMAGE}|" "$DOCKERFILE"
          git add "$LAUNCHER" "$DOCKERFILE"
          git commit -m "chore: bump llama.cpp to ${TAG}"
          git push origin "$BRANCH" --force
          gh pr create \
            --repo "${{ github.repository }}" \
            --title "chore: bump llama.cpp to ${TAG}" \
            --body "Own-CI Metal build published: https://github.com/${{ env.LLAMA_CPP_BUILDS_REPO }}/releases/tag/llamacpp-${TAG}-metal

          The Linux Docker images (\`LLAMA_CPP_IMAGE_CUDA\`/\`LLAMA_CPP_IMAGE_CPU\` in \`Dockerfile\`) were re-pinned to the same tag, with digests resolved via \`crane digest\` against \`ghcr.io/ggml-org/llama.cpp\`." \
            || echo "PR create failed or already exists for branch $BRANCH"
