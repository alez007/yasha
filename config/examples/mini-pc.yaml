# Low-resource home-assistant stack for a mini-PC (e.g. Intel N100, 16 GB RAM).
# CPU-only: quantized chat via llama-server, Kokoro TTS, whisper.cpp STT.

models:
  - name: "qwen"
    model: "lmstudio-community/Qwen3-4B-GGUF:*Q4_K_M.gguf"
    usecase: "generate"
    loader: "llama_server"
    num_cpus: 2

  - name: "kokoro"
    model: "kokoro-en-v0_19"
    usecase: "tts"
    loader: "sherpa_onnx"
    num_gpus: 0
    num_cpus: 1

  # Swap to `base` for multilingual.
  - name: "whisper"
    model: "base.en"
    usecase: "transcription"
    loader: "whispercpp"
    num_gpus: 0
    num_cpus: 1
    whispercpp_config:
      n_threads: 2
