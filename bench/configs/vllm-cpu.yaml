models:
  - name: "llm"
    # Unquantized: the vllm+cpu wheel has no CPU AWQ/GPTQ kernels, so an AWQ
    # model crashes at engine warmup on this backend.
    model: "Qwen/Qwen2.5-7B-Instruct"
    usecase: "generate"
    loader: "vllm"
    num_gpus: 0
    num_cpus: 8
    # Lift Ray Serve's per-replica concurrency cap (default 100) so the model
    # deployment isn't the bottleneck during the sweep.
    max_ongoing_requests: 256
    # MSHIP_PREFLIGHT=false: both phases use loader defaults for unset fields.
    vllm_engine_kwargs:
      tensor_parallel_size: 1
      max_model_len: 8192
