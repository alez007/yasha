models:
  - name: "llm"
    model: "lmstudio-community/Qwen2.5-7B-Instruct-GGUF:*Q4_K_M.gguf"
    # bench-tokenizer: Qwen/Qwen2.5-7B-Instruct
    usecase: "generate"
    loader: "llama_server"
    num_gpus: 1
    num_cpus: 2
    # Lift Ray Serve's per-replica concurrency cap (default 100) so the model
    # deployment isn't the bottleneck during the sweep.
    max_ongoing_requests: 256
    # MSHIP_PREFLIGHT=false: both phases use loader defaults for unset fields.
    llama_server_config:
      # Must cover --concurrency (8) so requests overlap instead of queuing,
      # which would muddy the TTFT/ITL comparison with queue-wait time.
      parallel: 8
      # Explicit (not -1/auto): the raw phase reads this verbatim, so leaving
      # it unset would let the two phases pick different offload counts.
      # 99 exceeds Qwen2.5-7B's 28 layers — full offload for both.
      n_gpu_layers: 99
      # The baseline arm drops ~4-7% of requests to llama-server's own
      # cpp-httplib keep-alive resets (modelship's uvicorn front door absorbs
      # this); not tunable via llama-server flags. assert_result_parity treats
      # this asymmetry as a non-failing finding, since it favors modelship.
